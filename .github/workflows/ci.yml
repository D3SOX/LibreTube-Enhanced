name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "README*.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
  push:
    paths-ignore:
      - "README*.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"

permissions:
  contents: read

jobs:
  debug-builds:
    runs-on: ubuntu-latest
    outputs:
      nightly_tag: ${{ steps.metadata.outputs.nightly_tag }}
      nightly_date: ${{ steps.metadata.outputs.nightly_date }}
    steps:
      - name: Set build metadata
        id: metadata
        run: |
          {
            echo "nightly_tag=nightly-${GITHUB_RUN_NUMBER}"
            echo "nightly_date=$(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "version_code=$((1000000 + GITHUB_RUN_NUMBER))"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Compile
        run: >-
          ./gradlew assembleDebug --no-daemon
          -PnightlyVersionCode=${{ steps.metadata.outputs.version_code }}
          -PnightlyVersionName=${{ steps.metadata.outputs.nightly_tag }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  nightly-release:
    if: >-
      github.repository == 'OpenTubeX/LibreTube-Enhanced' &&
      github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request'
    needs: debug-builds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v6
        with:
          name: unsigned-debug-apk
          path: unsigned

      - name: Sign APK
        id: sign_apk
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: unsigned
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APK
        run: mv "${{ steps.sign_apk.outputs.signedFile }}" LibreTube-Enhanced-nightly.apk

      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.debug-builds.outputs.nightly_tag }}
          target_commitish: ${{ github.sha }}
          name: LibreTube Enhanced ${{ needs.debug-builds.outputs.nightly_tag }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: LibreTube-Enhanced-nightly.apk
          body: |
            Built from `${{ github.sha }}` on ${{ needs.debug-builds.outputs.nightly_date }}.

            Nightly builds may be less stable than normal releases. Install them at your own risk.
